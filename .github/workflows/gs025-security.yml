name: GS-025 private-only security release
on:
  push:
    branches: [feature/gs-025-security-boundaries]
  pull_request:
    branches: [feature/gs-024-chatgpt-account-connection]
permissions:
  contents: read
jobs:
  privacy:
    name: Private deployment security and portable regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Private-only security, device auth, handoffs, approvals and mobile regressions
        run: python -m unittest tests.test_gs025_public_security tests.test_gs024_device_login tests.test_gs023_collaboration tests.test_gs018_codex_agent tests.test_gs017_group_approvals tests.test_gs016_codex tests.test_gs015_controls tests.test_gs014_mobile_ui tests.test_gs013_mobile_tailnet tests.test_gs010_coordinator tests.test_gs008_planning -v
      - name: Compile app
        run: python -m compileall -q ground_space
      - name: Frontend syntax
        run: node --check web/public/app.js
      - name: PowerShell restart syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/restart_gs016_codex.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
  browser:
    name: Browser mobile + desktop regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test-only Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser click-through
        run: node tools/test_gs015_browser.mjs

# This workflow CANNOT certify public multi-user isolation or actual owner's ASUS Codex filesystem execution.
