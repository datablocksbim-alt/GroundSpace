name: Ground Space private mobile checks

on:
  push:
    branches:
      - "feature/gs-013-coordinator-tailnet-mobile"
  pull_request:
    branches:
      - "feature/gs-010-coordinator-chat-routing"
    paths:
      - ".github/workflows/gs013-mobile.yml"
      - "ground_space/**"
      - "tests/test_gs013_mobile_tailnet.py"
      - "web/public/**"

permissions:
  contents: read

jobs:
  mobile-coordinator:
    name: Private tailnet and Coordinator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile local Python
        run: python -m compileall -q ground_space
      - name: Run mobile CSRF and existing Coordinator regression tests
        run: python -m unittest tests.test_gs013_mobile_tailnet tests.test_gs010_coordinator tests.test_gs008_planning -v
      - name: Verify existing chat interface JavaScript
        run: node --check web/public/app.js
      - name: Parse guarded mobile PowerShell setup helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("tools/activate_gs013_mobile.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List; exit 1 }

# Live HTTPS route, ASUS task queue, and iPhone Safari remain manual release gates.
