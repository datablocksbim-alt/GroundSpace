name: GS-024 private ChatGPT connection pilot
on:
  push:
    branches: [feature/gs-024-chatgpt-account-connection]
  pull_request:
    branches: [feature/gs-023-multi-agent-handoffs]
permissions:
  contents: read
jobs:
  security:
    name: Device login, handoffs and regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Device-login safety and existing portable regression
        run: python -m unittest tests.test_gs024_device_login tests.test_gs023_collaboration tests.test_gs018_codex_agent tests.test_gs017_group_approvals tests.test_gs016_codex tests.test_gs015_controls tests.test_gs014_mobile_ui tests.test_gs013_mobile_tailnet tests.test_gs010_coordinator tests.test_gs008_planning -v
      - name: Python compile
        run: python -m compileall -q ground_space
      - name: Frontend parser
        run: node --check web/public/app.js
  browser:
    name: Mobile and desktop browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Click test
        run: node tools/test_gs015_browser.mjs
