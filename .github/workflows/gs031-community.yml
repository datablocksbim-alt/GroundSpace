name: GS-031 Community foundation
on:
  push:
    branches: [feature/gs031-community-foundation]
  pull_request:
    paths:
      - 'ground_space/**'
      - 'tests/**'
      - 'tools/start_ground_space.ps1'
      - '.github/workflows/gs031-community.yml'
permissions:
  contents: read
jobs:
  portable-python:
    name: Standalone queue and regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile application
        run: python -m compileall -q ground_space
      - name: Community runtime contains no ASUS Administrator dependency
        shell: pwsh
        run: |
          $runtime = (Get-ChildItem ground_space -File -Filter '*.py' | Get-Content -Raw) -join "`n"
          if ($runtime -match 'AI Agents Datablocks|DATABLOCKS_ADMIN_ROOT|ground_space\.legacy') {
            throw 'Machine-specific Administrator dependency remains in the Community runtime.'
          }
      - name: JavaScript syntax
        run: node --check web/public/app.js

# No deployment, publication, installer upload or private-state access occurs here.
