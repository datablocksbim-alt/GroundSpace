name: GS-010 Coordinator smoke tests
on:
  push:
    branches:
      - feature/gs-010-coordinator-routing
  pull_request:
    branches:
      - feature/gs-008-premium-chat-goal-awareness
      - main

permissions:
  contents: read

jobs:
  coordinator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q ground_space tests
      - name: Coordinator and UI safety unit tests
        run: python -m unittest -v tests.test_gs010_coordinator tests.test_gs008_planning tests.test_gs007_ui
      - name: Validate chat UI JavaScript
        run: node --check web/public/app.js
