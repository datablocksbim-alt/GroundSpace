name: GS-022 portable release gates
on:
  push:
    branches: [feature/gs-022-release-stability]
  pull_request:
    branches: [feature/gs-021-codex-execution]
permissions:
  contents: read
jobs:
  full-python:
    name: Portable regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run every portable regression without ASUS-only Administrator runtime
        run: python -m unittest tests.test_gs018_codex_agent tests.test_gs017_group_approvals tests.test_gs016_codex tests.test_gs015_controls tests.test_gs014_mobile_ui tests.test_gs013_mobile_tailnet tests.test_gs010_coordinator tests.test_gs008_planning -v
      - name: Python compile
        run: python -m compileall -q ground_space
      - name: JavaScript syntax
        run: node --check web/public/app.js
      - name: Browser test syntax
        run: node --check tools/test_gs015_browser.mjs
      - name: Windows restart syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/restart_gs016_codex.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
  browser:
    name: Mobile + desktop Chromium interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test harness
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test critical buttons and approvals
        run: node tools/test_gs015_browser.mjs
